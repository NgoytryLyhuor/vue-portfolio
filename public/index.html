<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <title id="dynamic-title">Ngoytry Lyhuor</title>

  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="Ngoytry Lyhuor - Personal Website">
  <meta property="og:description" content="Welcome to my personal website and portfolio">
  <meta property="og:image" content="https://i.pinimg.com/736x/9e/96/b3/9e96b3f72dc23ae178aeca9d668eaabf.jpg">
  <!-- Replace with your actual image URL -->
  <meta property="og:url" content="https://ngoytrylyhuor.vercel.app/">
  <meta property="og:type" content="website">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ngoytry Lyhuor - Personal Website">
  <meta name="twitter:description" content="Welcome to my personal website and portfolio">
  <meta name="twitter:image" content="https://i.pinimg.com/736x/9e/96/b3/9e96b3f72dc23ae178aeca9d668eaabf.jpg">
  <!-- Replace with your actual image URL -->
  <meta name="twitter:site" content="@yourtwitterhandle"> <!-- Optional: Add your Twitter handle -->

  <!-- Tailwind CSS via CDN with custom configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              bg: '#030816',
              text: '#f3f4f6',
            },
            gray: {
              900: '#030816', // Override gray-900 with your color
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Ensure your dark background is applied */
    .dark {
      background-color: #030816;
    }

    /* Smooth transitions */
    body {
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Fix for nested dark mode elements */
    .dark .dark\:bg-gray-900 {
      background-color: #030816 !important;
    }
  </style>

  <script>
    // Initialize dark mode
    if (localStorage.theme === 'dark' ||
      (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      if (!('theme' in localStorage)) {
        if (e.matches) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }
    });
  </script>
</head>

<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled.
        Please enable it to continue.</strong>
  </noscript>
  <div id="app"></div>
</body>

</html>
