<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <title id="dynamic-title">Ngoytry Lyhuor</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="Ngoytry Lyhuor">
  <meta property="og:description" content="Welcome to my personal website and portfolio">
  <meta property="og:image" content="https://i.pinimg.com/736x/9e/96/b3/9e96b3f72dc23ae178aeca9d668eaabf.jpg">
  <meta property="og:url" content="https://ngoytrylyhuor.vercel.app">
  <link href="https://fonts.googleapis.com/css2?family=Hanuman:wght@100;300;400;700;900&family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Hanuman:wght@100;300;400;700;900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <meta property="og:type" content="website">

  <!-- Tailwind CSS via CDN with custom configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              bg: '#030816',
              text: '#f3f4f6',
            },
            gray: {
              900: '#030816', // Override gray-900 with your color
            }
          }
        }
      }
    }
  </script>

  <style>
    *{
      font-family: "Nunito", "Kantumruy Pro" !important;
    }
    /* Ensure your dark background is applied */
    .dark {
      background-color: #030816;
    }

    .text-sm {
      font-size: 14px !important;
    }

    .text-base {
      font-size: 16px !important;
    }

    /* Smooth transitions */
    body {
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Fix for nested dark mode elements */
    .dark .dark\:bg-gray-900 {
      background-color: #030816 !important;
    }

    /* Custom transitions */
    .transition-colors {
      transition-property: background-color, border-color, color, fill, stroke;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      transition-duration: 200ms;
    }
  </style>

  <script>
    // Initialize dark mode
    if (localStorage.theme === 'dark' ||
      (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      if (!('theme' in localStorage)) {
        if (e.matches) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }
    });
  </script>
</head>

<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
  </noscript>
  <div id="app"></div>
</body>

</html>
